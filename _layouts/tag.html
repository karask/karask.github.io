---
layout: default
---
{% assign tag = page.title %}
<header class="post-header">
  <h1>#{{ tag }}</h1>
</header>
<ul class="ledger posts">
  {% for post in site.posts %}
    {% for t in post.tags %}
      {% capture tg %}{{ t | downcase }}{% endcapture %}
      {% if tg == tag %}
        {% include post-list.html %}
      {% endif %}
    {% endfor %}
  {% endfor %}
</ul>
