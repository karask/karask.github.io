---
layout: default
---
{% assign category = page.title %}
<header class="post-header">
  <h1>{{ category | downcase }}</h1>
</header>
<ul class="ledger posts">
  {% for post in site.posts %}
    {% if post.category == category %}
      {% include post-list.html %}
    {% endif %}
  {% endfor %}
</ul>
