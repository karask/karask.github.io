---
layout: default
---
<article>
  <header class="post-header">
    <h1>{{ page.title }}</h1>
    <p class="meta">
      {{ page.date | date: "%Y-%m-%d" }} ·
      <a href="/categories/{{ page.category | downcase }}.html">{{ page.category | downcase }}</a>
      {% for tag in page.tags %}
        · <a href="/tags/{{ tag }}.html">#{{ tag }}</a>
      {% endfor %}
    </p>
  </header>
  <div class="prose">
    {{ content }}
  </div>
</article>
