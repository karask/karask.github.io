<li>
  <div class="meta">
    <span>{{ post.date | date: "%Y-%m-%d" }}</span>
    <span><a class="cat" href="/categories/{{ post.category | downcase }}.html">{{ post.category | downcase }}</a></span>
  </div>
  <div class="entry">
    <h3><a href="{{ post.url }}">{{ post.title }}</a></h3>
  </div>
</li>
